# render.yaml - Render deployment configuration
# https://render.com/docs/blueprint-spec

services:
  # FastAPI Backend
  - type: web
    name: travel-planner-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: travel-planner-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false  # Set this manually to your Vercel URL
    healthCheckPath: /health
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: travel-planner-db
    plan: free  # Change to starter or higher for production
    databaseName: travel_planner
    user: travel_planner
