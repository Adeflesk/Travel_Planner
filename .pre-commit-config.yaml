exclude: ^frontend/node_modules/|^\.venv/
repos:
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=250, --extend-ignore=E203]
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend Lint
        entry: bash -c "cd frontend && npx eslint ."
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false